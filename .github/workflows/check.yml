name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git show --format= --check HEAD
      - name: Check local links
        run: |
          python3 - <<'PY'
          import pathlib, re
          for page in pathlib.Path('.').rglob('*.md'):
              text = page.read_text()
              links = re.findall(r'\]\(([^\s)]+)\)', text)
              links += re.findall(r'<img\b[^>]*\bsrc=["\']([^"\']+)["\']', text, re.I)
              for link in links:
                  path = link.split('#', 1)[0]
                  if path and not re.match(r'[a-z][a-z0-9+.-]*:', path, re.I):
                      assert (page.parent / path).exists(), f'{page}: missing {path}'
          print('Documentation links passed')
          PY
